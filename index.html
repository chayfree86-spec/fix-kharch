<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-icon-dark.png" />
    <link rel="apple-touch-icon" href="/pwa-icon-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Fix Spend - Manage Fixed Expenses. Grow Your Café.</title>
    
    <!-- Automatic Fresh Code Cache-Bypass Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Apply the saved theme before render to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fix_spend_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#3B2314" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fix Spend" />
    <meta name="description" content="Manage Fixed Expenses. Grow Your Café. A polished fixed expense manager designed specifically for café owners." />
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-warm-beige text-coffee font-sans antialiased selection:bg-caramel-200 selection:text-coffee-dark min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Chay Chaupal Back to POS Admin Bridge -->
    <script>
      (function() {
        function mountBackBtn() {
          try {
            var params = new URLSearchParams(window.location.search);
            var isFromPos = params.get('from') === 'pos_admin' || (window.opener && !window.opener.closed);
            if (!isFromPos || document.getElementById('cc-return-to-pos-btn')) return;

            var btn = document.createElement('button');
            btn.id = 'cc-return-to-pos-btn';
            btn.type = 'button';
            btn.setAttribute('aria-label', 'Return to POS Admin');
            btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px;"><polyline points="15 18 9 12 15 6"></polyline></svg><span>Back to POS Admin</span>';
            btn.setAttribute('style', [
              'position: fixed',
              'top: 12px',
              'right: 14px',
              'z-index: 9999999',
              'display: inline-flex',
              'align-items: center',
              'justify-content: center',
              'background: #061426',
              'color: #20B45A',
              'border: 1.5px solid #20B45A',
              'border-radius: 9999px',
              'padding: 7px 15px',
              'font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
              'font-size: 12px',
              'font-weight: 700',
              'box-shadow: 0 4px 20px rgba(0,0,0,0.6)',
              'cursor: pointer',
              'transition: all 0.2s ease',
              'outline: none'
            ].join('; '));

            btn.onmouseover = function() {
              btn.style.background = '#20B45A';
              btn.style.color = '#FFFFFF';
            };
            btn.onmouseout = function() {
              btn.style.background = '#061426';
              btn.style.color = '#20B45A';
            };

            btn.onclick = function(e) {
              e.preventDefault();
              if (window.opener && !window.opener.closed) {
                try { window.opener.focus(); } catch(err) {}
                window.close();
              } else {
                var ret = params.get('return_url');
                if (ret) {
                  window.location.href = decodeURIComponent(ret);
                } else {
                  window.history.back();
                }
              }
            };

            document.body.appendChild(btn);
          } catch(e) {}
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', mountBackBtn);
        } else {
          mountBackBtn();
        }
      })();
    </script>
  </body>
</html>
